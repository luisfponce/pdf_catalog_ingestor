services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
      POSTGRES_DB: catalog
    ports:
      - "5432:5432"
    volumes:
      - catalog_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql+psycopg://catalog:catalog@postgres:5432/catalog
      OUTPUT_DIR: /data/output
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
    user: "${UID:-1000}:${GID:-1000}"

volumes:
  catalog_pgdata:
