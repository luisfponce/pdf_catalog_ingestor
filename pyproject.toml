[project]
name = "youngliving-catalog-ingestor"
version = "0.1.0"
description = "A deterministic PDF catalog extraction pipeline for structured JSON and PostgreSQL."
readme = "README.md"
license = "MIT"
authors = [{ name = "Luis F. Ponce" }]
requires-python = ">=3.12"
keywords = ["catalog", "docker", "etl", "pdf-extraction", "postgresql", "pydantic", "pymupdf"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing",
]
dependencies = [
  "PyMuPDF>=1.26,<2",
  "Pillow>=11,<14",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "typer>=0.16,<1",
  "rich>=14,<15",
]

[project.optional-dependencies]
dev = ["build>=1.3,<2", "pytest>=8,<9", "ruff>=0.12,<1"]

[project.urls]
Homepage = "https://github.com/github-owner/youngliving-catalog-ingestor"
Issues = "https://github.com/github-owner/youngliving-catalog-ingestor/issues"
Repository = "https://github.com/github-owner/youngliving-catalog-ingestor"

[project.scripts]
yl-catalog = "catalog_ingestor.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catalog_ingestor"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
